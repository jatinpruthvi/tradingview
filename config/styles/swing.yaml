# STYLE: swing
#
# 1h-4h swing. RECOMMENDED STARTING POINT: best signal-to-noise per unit of cost, tolerates realistic slippage, and needs only a few decisions a day.
timeframe:
  execution: 4h
  bias: 1d
  entry: 1h
strategy:
  name: smc_trend
  params:
    swing_length: 12
