[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tvlab"
version = "0.1.0"
description = "Multi-market, config-driven backtesting, validation and screening workbench"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["backtesting", "trading", "smart-money-concepts", "walk-forward", "validation"]

# Keep this list in sync with requirements.txt, which carries the explanatory
# comments about why the upper bounds are load-bearing.
dependencies = [
    "pandas>=2.1,<3",
    "numpy>=1.26,<2.3",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "tabulate>=0.9",
    "PyYAML>=6.0",
    "click>=8.1",
    "rich>=13.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
# Cross-validation of the SMC implementation against the popular reference.
reference = ["smartmoneyconcepts>=0.0.27"]
# TradingView scanner client for the universe screener.
screener = ["tvscreener>=0.8"]
# Live market data. Not needed for development, backtesting or validation.
live = ["ccxt>=4.2", "yfinance>=0.2.40"]
test = ["pytest>=8.0"]
all = ["tvlab[reference,screener,live,test]"]

[project.scripts]
tvlab = "tvlab.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
include = ["tvlab*"]

# -----------------------------------------------------------------------------
# Install as EDITABLE (`pip install -e .`).
#
# tvlab resolves its YAML configs and dashboard assets relative to the repository
# root (config/ and dashboard/static sit beside src/, not inside the package), so
# a non-editable wheel install would not find them. An editable install keeps the
# checkout as the source of truth, which is what you want for a research
# workbench anyway: you are expected to read and edit the configs.
# -----------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
filterwarnings = [
    # An all-NaN column is a legitimate state (buy-and-hold has no R multiples),
    # and metrics._nanmean exists precisely to handle it without warning.
    "ignore:Mean of empty slice:RuntimeWarning",
    "ignore:Degrees of freedom <= 0 for slice:RuntimeWarning",
    "ignore:invalid value encountered:RuntimeWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # line length is handled by the formatter; docstrings run long on purpose
    "B008",  # click decorators call functions in argument defaults by design
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
